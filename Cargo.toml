[workspace]
members = [
    "crates/agent",
    "crates/agent-protocol",
    "crates/core",
    "crates/display-codec",
    "crates/display-payload",
    "crates/display-services",
    "crates/display-viewer",
    "crates/display-protocol",
    "crates/image",
    "crates/gpu-payload",
    "crates/payload",
    "crates/app",
    "crates/keys",
    "crates/platform",
    "crates/seed",
    "crates/ui",
    "crates/vmlord",
    "crates/xtask",
]
# `crates/agent` and `crates/display-services` are Linux guest programs and
# cannot be built for the host target, so they stay out of the default set that
# `cargo build` and `cargo test` operate on. They are built on their own:
#
#     cargo agent
#     cargo display-services
#
# `crates/xtask` is build automation rather than product code, and is likewise
# reached through an alias -- see `.cargo/config.toml`.
#
# `crates/agent-protocol` is in both sets: the host links it too.
default-members = [
    "crates/agent-protocol",
    "crates/core",
    "crates/display-codec",
    "crates/display-payload",
    "crates/display-protocol",
    "crates/display-viewer",
    "crates/image",
    "crates/gpu-payload",
    "crates/payload",
    "crates/app",
    "crates/keys",
    "crates/platform",
    "crates/seed",
    "crates/ui",
    "crates/vmlord",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["VMLord contributors"]

[workspace.dependencies]
semver = { version = "1", features = ["serde"] }
# The logging facade. `log` stays alongside it, not as a leftover: `eframe` and
# other dependencies write through `log`, and `tracing-log` is what keeps their
# records reaching the file.
log = "0.4"
tracing = "0.1"
# `registry` is what stores span data, which is how an event inherits the VM
# name from the operation it happened inside. No `fmt`: its UTC timestamp needs
# the `time` crate, and `core::logging` already spells the stamp itself.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }
tracing-log = "0.2"
windows = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Builds zlib-ng against the same C runtime Rust links, rather than the debug
# one.
#
# `qcow` requires `flate2` with `zlib-ng-compat` unconditionally, so `libz-sys`
# builds zlib-ng through CMake. The `cmake` crate picks `CMAKE_BUILD_TYPE` from
# `opt-level`, and at `0` that is `Debug` -- whose default MSVC runtime is
# `MultiThreadedDebugDLL` (`/MDd`). Rust's MSVC target links the release CRT
# even in a dev profile, so the two disagree and the linker reports LNK4098.
#
# Raising the level for this one package selects `RelWithDebInfo` instead:
# the release CRT, with the C library's debug info kept. `/NODEFAULTLIB:MSVCRTD`
# would silence the warning while leaving two runtimes in one binary, which is
# the thing worth avoiding -- allocations crossing that boundary are what turns
# a warning into a corrupted heap.
[profile.dev.package.libz-sys]
opt-level = 2
