[workspace]
members = [
    "crates/core",
    "crates/image",
    "crates/app",
    "crates/legacy-backend",
    "crates/platform",
    "crates/seed",
    "crates/ui",
    "crates/vmlord",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["VMLord contributors"]

[workspace.dependencies]
log = "0.4"
windows = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
