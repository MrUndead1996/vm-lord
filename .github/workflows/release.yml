# Turns a version tag into a draft GitHub Release.
#
# Draft and never published automatically: the assets are inspected, and the
# installer's SHA-256 is checked against the manifest by hand, before anyone
# can download them. Nothing here decides what a release contains -- the tag
# does, and `cargo release-manifest` refuses a tag that disagrees with the
# workspace version.
name: Release

# Only a version tag. A push to a branch is not a release, and a workflow that
# also ran on one would publish "releases" of whatever happened to be there.
on:
  push:
    tags:
      - 'v*'

# Read by default, so a step added later starts with no rights over this
# repository and has to be given them deliberately.
permissions:
  contents: read

jobs:
  # The two payloads, built where they can be built. Both are produced by a
  # `docker build` on Linux, and the release itself has to run on Windows, so
  # they cannot come from the same job -- which is why releases used to ship
  # without them: `cargo dist` was called with neither directory, said so in
  # one line, and built a release with no GPU support and no guest display.
  #
  # Nothing here holds a token: this job only builds files and hands them over.
  payloads:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The guest display services are part of the display payload and are
      # built for musl, like the agent.
      - name: Install the guest target
        run: rustup target add x86_64-unknown-linux-musl

      # The container build is the test: the module is compiled against each
      # release's own headers, so one that does not build for 22.04, 24.04 or
      # 26.04 is an artifact that never exists rather than a guest that cannot
      # start a display. All three are built; one is packed.
      - name: Build the display payload
        run: ./rebuild_payload.sh

      # Mesa, the kernel headers and the closure check, all inside the pinned
      # image beside the spec. `pack` re-reads the provenance and refuses a
      # tree that disagrees with it.
      - name: Build the GPU payload
        run: |
          payloads/ubuntu-26.04-amd64/prepare.sh --output target/gpu-payload
          cargo gpu-payload \
            --recipe        target/gpu-payload/recipe.json \
            --input         target/gpu-payload/prepared \
            --archive       target/gpu-payload/payload.zip \
            --catalog-entry target/gpu-payload/catalog-entry.json

      # Collected into one tree rather than uploaded as the paths they were
      # built at, so what the release job unpacks is a layout this step chose
      # and not whichever common ancestor the upload action inferred.
      #
      # One display pair and not one per Ubuntu release: the step above builds
      # in all three containers because each is a compile gate, and
      # `rebuild_payload.sh` packs one of them into `release/`. Three archives
      # would be the same content three times -- since task #169 a payload's
      # distribution and release are provenance rather than a catalogue key.
      - name: Collect the payloads
        run: |
          set -euo pipefail
          mkdir -p target/payloads/gpu target/payloads/display
          # Only these two: the prepared tree and the recipe are inputs to
          # `pack`, and `cargo dist` reads the packed pair alone.
          cp target/gpu-payload/payload.zip \
             target/gpu-payload/catalog-entry.json \
             target/payloads/gpu
          cp target/display-payload/release/payload.zip \
             target/display-payload/release/catalog-entry.json \
             target/payloads/display
          find target/payloads -type f -printf '%P\t%s bytes\n' | sort

      - name: Hand the payloads to the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: payloads
          path: target/payloads
          # A payload that failed to build must fail the release, not shrink
          # it: the upload is the last chance to notice an empty tree.
          if-no-files-found: error

  release:
    needs: payloads
    # The only job allowed to write, and it writes exactly one thing: the draft
    # release it creates at the end.
    permissions:
      contents: write
    # Windows, because the release executables must come from MSVC and the
    # installer is compiled by Inno Setup, which the image already carries.
    runs-on: windows-2025
    steps:
      # Pinned to a commit rather than to `v7`: a tag is a name its owner can
      # move onto other code, and this job holds a token that can write here.
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The whole history: the next step has to prove the tag is on `main`,
          # which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Verify the tag is on main and matches the workspace version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "$tag is not reachable from main; releases are cut from merged history"
          }
          # The same rule `cargo release-manifest` enforces, applied before the
          # build rather than after it: a mismatch here costs a second, and a
          # mismatch at the end costs the whole build.
          $version = (cargo metadata --locked --format-version 1 --no-deps |
            ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'vmlord' } |
            Select-Object -ExpandProperty version
          if ($tag -ne "v$version") {
            throw "tag $tag does not match the workspace version $version"
          }
          # Published for every later step, so the tag, the compiled
          # installer's name and the release manifest all read one value that
          # was checked here rather than each deriving its own.
          "VMLORD_VERSION=$version" | Add-Content -Path $env:GITHUB_ENV

      - name: Install the guest agent's target
        shell: pwsh
        run: rustup target add x86_64-unknown-linux-musl

      - name: Install the licence-notice generator
        shell: pwsh
        run: |
          # `--features cli` is not optional: from 0.9 the binary is behind
          # that feature, and without it `cargo install` builds the library,
          # installs nothing, and still exits 0 with a warning -- which is how
          # this step once passed while leaving `cargo dist` to fail two steps
          # later with a different message.
          cargo install --locked --features cli cargo-about@0.9.2
          # So the step proves what it claims: an install that produced no
          # binary fails here, where the log says what went wrong.
          cargo about --version

      # Compiling and running are separate steps because a step's name is a
      # claim about what it did: a build error under a step called "Test" is
      # reported as a test problem, which is the wrong place to start looking.
      #
      # The MSVC toolchain, not `cargo test-windows`: that alias exists so WSL
      # can cross-check the Windows code, and here the native toolchain is the
      # one the released binaries are actually built with.
      - name: Compile the tests
        shell: pwsh
        run: |
          cargo test --locked --no-run
          cargo test --locked -p xtask --no-run

      # Near-free: everything above is already built, so this only runs.
      - name: Run the tests
        shell: pwsh
        run: |
          cargo test --locked
          cargo test --locked -p xtask

      - name: Take the payloads from the Linux job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: payloads
          path: target/payloads

      # What this step insists on is that both kinds arrived: `cargo dist`
      # builds a payload-less release quite happily and says so in one line,
      # which is exactly how 0.2.0 shipped without either. One pair each, in
      # the layout the collecting step chose.
      #
      # `dist` then re-reads each catalog entry through the payload crates' own
      # validation and hashes the archive against the digest that entry claims,
      # so a pair damaged in transit does not reach the installer.
      - name: Build the distribution
        shell: pwsh
        run: |
          $gpu = 'target/payloads/gpu'
          $display = 'target/payloads/display'
          if (-not (Test-Path -LiteralPath "$gpu/payload.zip")) {
            throw "no GPU payload at $gpu; the payloads job did not produce one"
          }
          if (-not (Test-Path -LiteralPath "$display/payload.zip")) {
            throw "no display payload at $display; the payloads job did not produce one"
          }
          cargo dist --gpu-payload $gpu --display-payload $display

      - name: Check the staged distribution
        shell: pwsh
        run: pwsh -File installer/check.ps1 target/dist -RequirePayloads

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup 6 is not on this image at $iscc"
          }
          # `/DAppVersion=` is how the workspace version reaches the
          # installer. The script has no version of its own to disagree with
          # this one, and refuses to compile without it.
          & $iscc "/DAppVersion=$env:VMLORD_VERSION" installer/vmlord.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Write and re-verify the release manifest
        shell: pwsh
        run: |
          $version = $env:VMLORD_VERSION
          $installer = "target/installer/VMLord-$version-x86_64-setup.exe"
          cargo release-manifest `
            --tag $env:GITHUB_REF_NAME `
            --installer $installer `
            --output target/installer/release-manifest.json
          # Independently recomputed: the manifest is what every installation
          # will trust, so it is checked against the file once more by a
          # different tool than the one that wrote it.
          $expected = (Get-Content target/installer/release-manifest.json |
            ConvertFrom-Json).installer.sha256
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) {
            throw "the manifest says $expected but the installer hashes to $actual"
          }
          "$actual  VMLord-$version-x86_64-setup.exe" |
            Set-Content -Encoding ascii target/installer/SHA256SUMS.txt
          # The corresponding sources, as the GPL expects them to travel with
          # the binary. `git archive` uses the tag, so it is the exact tree.
          git archive --format=zip --prefix="vmlord-$version/" `
            -o "target/installer/vmlord-$version-source.zip" $env:GITHUB_REF_NAME

      # Drafted, never published: a person compares the installer's hash with
      # the manifest and installs it in both scope modes before anyone else can
      # download it.
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:VMLORD_VERSION
          gh release create $env:GITHUB_REF_NAME `
            --draft `
            --title "VMLord $version" `
            --generate-notes `
            "target/installer/VMLord-$version-x86_64-setup.exe" `
            target/installer/release-manifest.json `
            target/installer/SHA256SUMS.txt `
            target/dist/THIRD-PARTY-LICENSES.txt `
            "target/installer/vmlord-$version-source.zip"
