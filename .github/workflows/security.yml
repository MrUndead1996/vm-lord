# Static analysis and dependency vulnerability checks.
name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Rust analysis uses rust-analyzer and does not need a product build.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: rust
          build-mode: none
          queries: security-extended

      - name: Analyse Rust
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:rust

  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Cargo.lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cargo-audit
        run: |
          cargo install --locked cargo-audit@0.22.2
          cargo audit --version

      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
