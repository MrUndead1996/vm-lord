# Static analysis and dependency vulnerability checks.
name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      # The extractor drives rust-analyzer with the `test` cfg enabled, so every
      # `#[cfg(test)] mod tests` is read as if it shipped -- which is where all
      # of this repository's hard-coded-password alerts came from. `-test` turns
      # that cfg off for extraction; the brackets are not decoration, the option
      # is a list and the extractor parses environment values as TOML.
      #
      # It belongs on the job rather than on a step because the extraction for
      # `build-mode: none` runs inside `analyze`, not `init`.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: '["-test"]'
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Rust analysis uses rust-analyzer and does not need a product build.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: rust
          build-mode: none
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Analyse Rust
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: /language:rust

  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Cargo.lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cargo-audit
        run: |
          cargo install --locked cargo-audit@0.22.2
          cargo audit --version

      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
