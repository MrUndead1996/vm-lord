# DKMS registration for the dxgkrnl module this payload carries.
#
# The build command is deliberately absent: DKMS then runs
# `make -C $kernel_source_dir M=<build dir>` against the running kernel's
# headers, which is exactly what this module needs, and what the payload's
# Kbuild is written for. Naming it here would be a second copy of a default
# that changes with DKMS rather than with us.
#
# AUTOINSTALL is what carries the module across Ubuntu's own kernel upgrades
# without VMLord being involved: the payload records the kernel it was proven
# on, it does not pin the guest to it.

PACKAGE_NAME="dxgkrnl"
PACKAGE_VERSION="6.18.0-msft-wsl"

BUILT_MODULE_NAME[0]="dxgkrnl"
DEST_MODULE_LOCATION[0]="/kernel/drivers/hv"

AUTOINSTALL="yes"
