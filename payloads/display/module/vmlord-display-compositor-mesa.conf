# Shipped at /etc/systemd/user/org.gnome.Shell@.service.d/, where it applies to
# the greeter's compositor -- `org.gnome.Shell@gdm.service` -- and to a
# logged-in user's alike.
#
# A GPU-PV guest points every process in a user's session at the payload's Mesa,
# by two paths that have to be undone separately. The environment is one:
# `50-vmlord-gpu` exports GALLIUM_DRIVER=d3d12 and MESA_LOADER_DRIVER_OVERRIDE.
# The linker cache is the other: `/etc/ld.so.conf.d/vmlord-wsl-mesa.conf` makes
# `libgbm` and `libEGL_mesa` resolve to that Mesa for everything on the system,
# and no environment variable removes an entry from the cache.
#
# That Mesa renders through /dev/dxg and cannot hand a buffer to a foreign KMS
# device. A compositor holding vmlord_drm gets EGL_BAD_ALLOC out of
# `gbm_surface_lock_front_buffer`, never finishes its modeset, and leaves the
# connector disabled -- a black window with nothing behind it for capture to
# read. Measured on a live guest under task #131, where removing the
# environment alone changed nothing: the cache still won.
#
# So LD_LIBRARY_PATH is set rather than only unset. The loader searches it
# before the cache, which is what puts the compositor back on the
# distribution's Mesa; the overrides are unset because that Mesa ships a d3d12
# driver too and would load it if told to.
#
# Which directory that is, this file does not say. The agent appends the
# `Environment=LD_LIBRARY_PATH=` line when it installs this drop-in, out of the
# library layout it detected in the guest: a multiarch guest keeps that Mesa in
# `/usr/lib/<triplet>` and a guest without a multiarch directory keeps it in
# `/usr/lib`, and a shipped constant is right on one of them.
#
# The compositor only. Everything launched from the session keeps the whole GPU
# environment, which is where the acceleration was wanted in the first place.
[Service]
UnsetEnvironment=GALLIUM_DRIVER MESA_LOADER_DRIVER_OVERRIDE __GLX_VENDOR_LIBRARY_NAME VK_DRIVER_FILES
