# Shipped without a unit, and only for a guest with no adapter. The agent
# installs it under /etc/systemd/user/ in the drop-in directory of the unit the
# compositor of this guest turned out to be started by -- the template rather
# than the instance, so that the greeter's compositor and every logged-in user's
# each read it -- and removes it again from a guest that has one.
#
# Which way round that goes changed with task #180. The payload's Mesa carries a
# patch that lets d3d12 present through a dumb BO on `vmlord_drm`, so a guest
# with `/dev/dxg` and a payload that carries the patch wants its compositor on
# the payload's Mesa, drawing on the GPU. What this file is for is every other
# guest: that Mesa is built `-Dllvm=disabled`, so with no adapter it falls back
# to softpipe, while the distribution's falls back to llvmpipe. Left in place,
# this file would cost an accelerated guest the GPU; taken away, it would cost
# the other one a usable desktop.
#
# Which of the two a guest is, the guest cannot tell by looking at itself: an
# older payload's Mesa binds the device and draws on it and only then fails to
# present, so the compositor comes up to `No GPUs found` and the screen stays
# black. The payload says so instead -- `compositor-scanout` in the
# `guest_capabilities` of its `sources.json` -- and a payload that says nothing
# keeps this file (#191).
#
# A compositor that no unit starts -- one launched from a login shell -- never
# receives this file, because a drop-in would have nothing to attach to. That
# session is isolated by whatever launches it, which has to set the same two
# things for the compositor alone and not for the session under it.
#
# A GPU-PV guest points every process in a user's session at the payload's Mesa,
# by two paths that have to be undone separately. The environment is one:
# `50-vmlord-gpu` exports GALLIUM_DRIVER=d3d12 and MESA_LOADER_DRIVER_OVERRIDE.
# The linker cache is the other: `/etc/ld.so.conf.d/vmlord-wsl-mesa.conf` makes
# `libgbm` and `libEGL_mesa` resolve to that Mesa for everything on the system,
# and no environment variable removes an entry from the cache.
#
# On a guest with no adapter that Mesa renders through /dev/dxg, which is not
# there, and it cannot hand a buffer to a foreign KMS device either. A compositor
# holding vmlord_drm gets EGL_BAD_ALLOC out of
# `gbm_surface_lock_front_buffer`, never finishes its modeset, and leaves the
# connector disabled -- a black window with nothing behind it for capture to
# read. Measured on a live guest under task #131, where removing the
# environment alone changed nothing: the cache still won.
#
# So LD_LIBRARY_PATH is set rather than only unset. The loader searches it
# before the cache, which is what puts the compositor back on the
# distribution's Mesa; the overrides are unset because that Mesa ships a d3d12
# driver too and would load it if told to.
#
# Which directory that is, this file does not say. The agent appends the
# `Environment=LD_LIBRARY_PATH=` line when it installs this drop-in, out of the
# library layout it detected in the guest: a multiarch guest keeps that Mesa in
# `/usr/lib/<triplet>` and a guest without a multiarch directory keeps it in
# `/usr/lib`, and a shipped constant is right on one of them.
#
# The compositor only. Everything launched from the session keeps the whole GPU
# environment, which is where the acceleration was wanted in the first place.
[Service]
UnsetEnvironment=GALLIUM_DRIVER MESA_LOADER_DRIVER_OVERRIDE __GLX_VENDOR_LIBRARY_NAME VK_DRIVER_FILES
