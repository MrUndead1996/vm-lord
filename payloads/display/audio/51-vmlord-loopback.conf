# Shipped at /etc/wireplumber/wireplumber.conf.d/51-vmlord-loopback.conf
# For WirePlumber 0.5, which reads SPA-JSON drop-ins.
#
# The loopback's capture side is where vmlord-display-audio reads the desktop
# from. It is not a microphone, and a VM that offers it as one hands every
# application a source that records whatever is playing.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.platform-snd_aloop.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
