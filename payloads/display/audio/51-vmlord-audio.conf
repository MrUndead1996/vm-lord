# Shipped at /etc/pipewire/pipewire.conf.d/51-vmlord-audio.conf
#
# The desktop's output, bound straight to the loopback's playback half.
#
# Not left to PipeWire's ALSA monitor, because that monitor refuses a whole
# card while any of its PCM devices is in use by somebody else:
#
#   spa.alsa check_pcm_device_availability: card 0 pcm device pcm1c busy
#   spa.alsa process_card: ALSA card 0 unavailable (Device or resource busy)
#
# vmlord-display-audio holds exactly that device for the life of a session, so
# a monitored card would vanish from the desktop the moment sound started
# working -- leaving the user with a Dummy Output and nothing to play into.
# A statically declared node is opened by PipeWire itself and skips that check,
# which also removes the race between a login and the daemon's first capture.

context.objects = [
  { factory = adapter
    args = {
      factory.name         = api.alsa.pcm.sink
      node.name            = "vmlord-audio"
      node.description     = "VMLord audio"
      media.class          = "Audio/Sink"
      api.alsa.path        = "hw:Loopback,0,0"
      # What the daemon pins on the other half of the cable when it opens
      # first. The two halves of a loopback cable must agree, and this is the
      # agreement written down where a reader can find it.
      audio.format         = "S16LE"
      audio.rate           = 48000
      audio.channels       = 2
      audio.position       = [ FL FR ]
      api.alsa.period-size = 480
      # Above whatever the monitor might offer if the card is ever free.
      priority.session     = 2000
    }
  }
]
