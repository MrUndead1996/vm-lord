[package]
name = "vmlord-display-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

# The window VMLord opens on a VM's display. A process of its own because a
# session outlives the application that started it.
[[bin]]
name = "vmlord-display"
path = "src/main.rs"
test = false
bench = false

[lib]
name = "vmlord_display_viewer"
path = "src/lib.rs"

[dependencies]
tracing.workspace = true
prost = "0.14"
# Settings and the application log, the same two `vmlord-com1` takes.
vmlord-core = { path = "../core" }
vmlord-display-codec = { path = "../display-codec" }
vmlord-display-protocol = { path = "../display-protocol" }
# The clipboard's only codec. GTK applications often offer a picture as PNG and
# nothing else, and no Windows clipboard format holds one; a DIB does, and this
# is what gets between them.
png = "0.18"

# The COM callback for endpoint changes is written with `#[implement]`, whose
# expansion names `windows_core` at the crate root rather than through the
# `windows` re-export.
#
# The version is not ours to choose: `windows` 0.62 depends on
# `windows-core` ^0.62, and a newer one here is a second copy of the crate
# rather than a replacement -- `#[implement]` then expands against traits the
# interfaces from `windows` do not implement. It moves when `windows` does.
windows-core = "0.62"
windows = { workspace = true, features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
prost-build = "0.14"
# Compiles the `.proto` in-process, so no `protoc` has to be installed.
protox = "0.9"

[lints]
workspace = true

[dev-dependencies]
# The scoped subscriber the capture tests install: they assert what a record
# does not contain, which needs somewhere to read records back from.
tracing-subscriber.workspace = true
