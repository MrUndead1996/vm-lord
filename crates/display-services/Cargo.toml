[package]
name = "vmlord-display-services"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

# Guest programs, so they are not part of the workspace's default build -- see
# `default-members` in the root manifest. Build them with:
#
#     cargo display-services
[[bin]]
name = "vmlord-display-broker"
path = "src/bin/broker.rs"
bench = false

[[bin]]
name = "vmlord-display-session"
path = "src/bin/session.rs"
bench = false

[[bin]]
name = "vmlord-display-clipboard"
path = "src/bin/clipboard.rs"
bench = false

[[bin]]
name = "vmlord-display-audio"
path = "src/bin/audio.rs"
bench = false

[[bin]]
name = "vmlord-display-tray"
path = "src/bin/tray.rs"
bench = false

# Not a guest program: it measures the pipeline on the host that built it, and
# `payloads/display/prepare.sh` names the three above rather than collecting
# whatever the target directory holds. Reached through `cargo
# display-pipeline-bench`.
[[bin]]
name = "vmlord-display-pipeline-bench"
path = "src/bin/pipeline_bench.rs"
bench = false

# A guest program, but not one the payload installs: it reads the desktop that
# is on screen to measure what a real dma-buf's coherency call costs, which
# only a running guest has. Built by `cargo display-services` and copied over
# by hand.
[[bin]]
name = "vmlord-display-guest-probe"
path = "src/bin/guest_probe.rs"
bench = false

[dependencies]
libc = { version = "0.2", default-features = false }
prost = "0.14"
# For the one path the guest's secret lives at, so there is never a second
# spelling of it. Pure Rust, like everything else the guest side links.
vmlord-agent-protocol = { path = "../agent-protocol" }
vmlord-display-codec = { path = "../display-codec" }
vmlord-display-protocol = { path = "../display-protocol" }
# The tray's StatusNotifierItem side. Pure Rust on the same zbus as above, so
# the musl build stays toolchain-free. No default features drops ksni's tokio;
# `async-io` is the runtime the zbus above already uses, and `blocking` puts
# the tray service on a plain thread, which is what a program of sockets and
# menus wants.
ksni = { version = "0.3", default-features = false, features = [
    "async-io",
    "blocking",
] }
# GNOME's clipboard lives inside the compositor, and
# `org.gnome.Mutter.RemoteDesktop` is what reaches it from outside -- the same
# interface gnome-remote-desktop uses. No default features, so nothing here
# links a system C library and the musl build stays toolchain-free.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }

[build-dependencies]
prost-build = "0.14"
# Compiles the `.proto` in-process, so no `protoc` has to be installed on the
# machine that builds a guest.
protox = "0.9"

[lints]
# These are guest programs that own DRM, socket and mapping ABIs directly.
# `unix.rs`, `vsock.rs` and `drm/` are the only modules that need unsafe calls
# into the kernel ABI.

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
