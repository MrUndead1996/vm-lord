// The private interface between the two guest display services.
//
// Not the display protocol: this never leaves the guest, both binaries ship in
// one payload at one version, and there is nothing here to negotiate. It is a
// schema rather than a hand-rolled encoding because the workspace already
// compiles protobuf in-process, and because "typed operations only" is the rule
// this interface exists to keep.

syntax = "proto3";

package vmlord.display.broker;

message Envelope {
  oneof message {
    Attach attach = 1;
    NextFrame next_frame = 2;
    SessionOpened session_opened = 3;
    SessionClosed session_closed = 4;
    KeyframeRequested keyframe_requested = 5;
    Snapshot snapshot = 6;
    Report report = 7;
    InputDevices input_devices = 8;
    Geometry geometry = 9;
    ClipboardOpened clipboard_opened = 10;
    AudioOpened audio_opened = 11;
    UserCommand user_command = 12;
    RestartSession restart_session = 13;
    DisplayModesRequested display_modes_requested = 14;
    DisplayModes display_modes = 15;
  }
}

// The unprivileged process introducing itself.
message Attach {}

// It is ready for another frame. The reply arrives at the next vblank, and
// other messages may arrive before it.
message NextFrame {}

// A control handshake completed. Everything the frame and input channels need,
// and nothing the secret could be recovered from.
message SessionOpened {
  bytes session_id = 1;
  bytes frame_key = 2;
  bytes input_key = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 tile_size = 6;
  bool cursor_stream = 7;
}

// A control handshake completed, as the clipboard daemon needs it: the session
// it belongs to and the one channel key that daemon may use. The frame and
// input keys are not here -- that daemon has no business with those sockets,
// and a compromised one must not gain a picture or a keyboard.
message ClipboardOpened {
  bytes session_id = 1;
  bytes clipboard_key = 2;
}

// The same, as the audio daemon needs it: one session and the one channel key
// that daemon may use. A compromised audio daemon must gain neither a picture,
// a keyboard nor a selection.
message AudioOpened {
  bytes session_id = 1;
  bytes audio_key = 2;
}

// Control was lost or the host sent EndSession. Stop capturing and release
// everything.
message SessionClosed {
  string reason = 1;
}

// The viewer asked for a keyframe. Recovery, not flow control.
message KeyframeRequested {}

// The keyboard and the pointer, whose descriptors are attached to this
// datagram in that order. Sent when the broker adopts a peer, and again in
// answer to its Attach. A broker with no input devices never sends it.
message InputDevices {}

// The output changed size and this is what it is now, read off the
// framebuffer the compositor committed rather than off what was asked for.
// The session process rebuilds its encoder and owes its peer a StreamConfig
// and a keyframe.
message Geometry {
  uint32 width = 1;
  uint32 height = 2;
  // The refresh the compositor committed, read off the CRTC's timing. Zero
  // for an output whose mode could not be read.
  uint32 refresh_hz = 3;
}

// What the planes hold at one vblank.
message Snapshot {
  uint64 sequence = 1;
  repeated PlaneLayout planes = 2;
  // The buffer ids whose descriptors are attached to this datagram, in the
  // order they were attached. A buffer the peer already holds is not resent.
  repeated uint64 new_buffers = 3;
}

message PlaneLayout {
  PlaneKind kind = 1;
  uint64 buffer = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 stride = 5;
  // The DRM fourcc, checked against what this build will map.
  uint32 format = 6;
  // Signed: a cursor plane goes negative at the left and top edges.
  sint32 x = 7;
  sint32 y = 8;
  // Whether `damage` is the whole truth about what this commit repainted.
  // False means the answer is not known, which is what a compositor that set
  // no damage means and what a commit nobody read means: the encoder has to
  // compare the frame instead of trusting a smaller list. An empty `damage`
  // with this set is the other answer -- a commit that repainted nothing.
  bool damage_known = 9;
  repeated DamageRect damage = 10;
}

// A repainted region, in framebuffer pixels.
message DamageRect {
  uint32 x = 1;
  uint32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

enum PlaneKind {
  PLANE_KIND_UNSPECIFIED = 0;
  PLANE_KIND_PRIMARY = 1;
  PLANE_KIND_CURSOR = 2;
}

// What the unprivileged process wants the host told.
message Report {
  string detail = 1;
}

// A display mode as the host carries it. The same shape as the display
// protocol's `DisplayTiming`, restated here because this schema never imports
// the wire's: what the numbers mean is a contract between the two, and the
// test that the tray command kinds match the viewer's is what holds them
// together.
message DisplayTiming {
  uint32 width = 1;
  uint32 height = 2;
  uint32 refresh_hz = 3;
}

// A command the guest's own user raised, on its way to the host viewer.
//
// The kinds are the display protocol's `GuestCommandKind` by number, one for
// one: the broker forwards the record whole rather than deciding it, so a
// command here and a command on the wire have to stay the same list. The test
// beside the mapping is what notices drift between the two schemas.
enum UserCommandKind {
  USER_COMMAND_KIND_UNSPECIFIED = 0;
  USER_COMMAND_KIND_TOGGLE_FULLSCREEN = 1;
  USER_COMMAND_KIND_RELEASE_KEYBOARD = 2;
  USER_COMMAND_KIND_SEND_SECURE_ATTENTION = 3;
  USER_COMMAND_KIND_TOGGLE_MUTE = 4;
  USER_COMMAND_KIND_QUALITY_AUTO = 5;
  USER_COMMAND_KIND_QUALITY_DESKTOP = 6;
  USER_COMMAND_KIND_SET_DISPLAY_MODE = 7;
}

message UserCommand {
  UserCommandKind kind = 1;
  // The host monitor mode to come up on. Set only when `kind` is
  // `USER_COMMAND_KIND_SET_DISPLAY_MODE`, and then required -- exactly as the
  // wire's own `GuestCommand` requires it.
  DisplayTiming display_mode = 2;
}

// The tray asks for the guest display session to be put back.
message RestartSession {}

// The tray asks which modes the host has offered.
message DisplayModesRequested {}

// What the host offered, and the one of them it chose. Both empty until a
// host has published a list: a guest no viewer has met has no modes to show.
message DisplayModes {
  repeated DisplayTiming modes = 1;
  DisplayTiming selected = 2;
}
