[package]
name = "vmlord-seed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
vmlord-core = { path = "../core" }
# For the one path the host and the guest must spell the same way: where the
# agent's secret lands inside the VM.
vmlord-agent-protocol = { path = "../agent-protocol" }

[dev-dependencies]
vmlord-core = { path = "../core", features = ["test-profile"] }
# The scoped subscriber the redaction guard installs: it asserts what a record
# does not contain, which needs somewhere to read records back from.
tracing-subscriber.workspace = true
# Production prints the document by hand; the tests read it back the way
# cloud-init's PyYAML does, so they assert on meaning rather than on bytes.
serde_yaml_ng = "0.10"

[lints]
workspace = true
