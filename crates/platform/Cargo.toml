[package]
name = "vmlord-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vmlord-core = { path = "../core" }
vmlord-keys = { path = "../keys" }
# For the VM's agent secret: minted here, kept beside the VM and handed to the
# guest through its seed.
vmlord-agent-protocol = { path = "../agent-protocol" }
# The seed documents and their ISO image. The crate is pure -- no filesystem,
# no network, no Windows API -- and writing its bytes to disk is what this
# layer is for.
vmlord-seed = { path = "../seed" }
# The GPU payload boundary: catalog, verified cache and per-VM staging. The
# crate is portable and knows nothing of Windows; this layer is what gives it a
# VM directory to fill.
vmlord-display-payload = { path = "../display-payload" }
vmlord-display-protocol = { path = "../display-protocol" }
# The launch contract's private schema, which the viewer defines and this side
# speaks. Linked rather than copied: two encoders of one wire format are two
# things to keep in step.
vmlord-display-viewer = { path = "../display-viewer" }
vmlord-gpu-payload = { path = "../gpu-payload" }
vmlord-payload = { path = "../payload" }
arcbox-dhcp = "0.7"
tracing.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `getrandom` is off deliberately: the salt comes from `BCryptGenRandom`, the
# same source AppSandbox used, rather than from a second RNG stack.
sha-crypt = { version = "0.6", default-features = false, features = [
    "alloc",
    "password-hash",
] }
uuid = { version = "1", features = ["v4", "serde"] }
# The host's copy of a VM's agent secret passes through a `String` on its way
# out of the file it is stored in; `Zeroizing` is what keeps that copy from
# outliving the read.
zeroize = "1.9"
# The CLDR table that turns a Windows time-zone key -- `Russian Standard Time`
# -- into the IANA name a Linux guest wants. Generated data and nothing else:
# with default features it pulls in no dependencies of its own.
windows-timezones = "0.5.1"
windows = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_Console",
    # `SetupGetInfDriverStoreLocationW` takes an alternate-platform structure
    # whose machine type comes from here, so the binding is gated on it.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_HostComputeNetwork",
    "Win32_System_HostComputeSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[dev-dependencies]
vmlord-core = { path = "../core", features = ["test-profile"] }
# The scoped subscriber the diagnostics tests install: records are read back
# from a sink rather than returned, so a test needs somewhere to read them.
tracing-subscriber.workspace = true
# Only the `#[ignore]`d import test uses it, to read a real cloud image the way
# production will. The dependency runs one way: `image` knows nothing of
# Windows, and `platform` does not depend on it to build.
vmlord-image = { path = "../image" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
