[package]
name = "vmlord-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vmlord-core = { path = "../core" }
vmlord-keys = { path = "../keys" }
# The seed documents and their ISO image. The crate is pure -- no filesystem,
# no network, no Windows API -- and writing its bytes to disk is what this
# layer is for.
vmlord-seed = { path = "../seed" }
arcbox-dhcp = "0.6"
log.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `getrandom` is off deliberately: the salt comes from `BCryptGenRandom`, the
# same source AppSandbox used, rather than from a second RNG stack.
sha-crypt = { version = "0.6", default-features = false, features = [
    "alloc",
    "password-hash",
] }
uuid = { version = "1", features = ["v4", "serde"] }
# The CLDR table that turns a Windows time-zone key -- `Russian Standard Time`
# -- into the IANA name a Linux guest wants. Generated data and nothing else:
# with default features it pulls in no dependencies of its own.
windows-timezones = "0.5.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Com",
    "Win32_System_HostComputeNetwork",
    "Win32_System_HostComputeSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
# Only the `#[ignore]`d import test uses it, to read a real cloud image the way
# production will. The dependency runs one way: `image` knows nothing of
# Windows, and `platform` does not depend on it to build.
vmlord-image = { path = "../image" }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
