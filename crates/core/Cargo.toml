[package]
name = "vmlord-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-profile = []

[dependencies]
# Kept for the bridge alone: `LogTracer` forwards what dependencies write
# through `log` into the subscriber below.
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
toml = "0.8"
# A VM's stable identity, which the SSH contract remembers a guest's host key
# under. No random generation here: ids are minted where VMs are created.
uuid = { version = "1", default-features = false }

[lints]
workspace = true
