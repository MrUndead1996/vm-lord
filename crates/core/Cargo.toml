[package]
name = "vmlord-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
# A VM's stable identity, which the SSH contract remembers a guest's host key
# under. No random generation here: ids are minted where VMs are created.
uuid = { version = "1", default-features = false }

[dev-dependencies]
# Only the SSH round-trip tests use it, to read stored documents back the way
# the metadata store will.
serde_json = "1.0"

[lints]
workspace = true
