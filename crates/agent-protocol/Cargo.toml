[package]
name = "vmlord-agent-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# Runtime only: the generated types are plain structs with `encode`/`decode`.
# No gRPC stack, because the transport is one HvSocket stream per VM.
prost = "0.14"

# What `auth` is made of. All of it is pure Rust: the agent is linked
# statically against musl with no C toolchain, and a crypto crate that wanted
# OpenSSL would cost that.
base64 = "0.23"
getrandom = "0.4"
hmac = "0.13"
sha2 = "0.11"
# Comparing a tag with `==` leaks where two tags first differ, which is enough
# to forge one a byte at a time.
subtle = "2.6"
zeroize = "1.9"

[build-dependencies]
prost = "0.14"
prost-build = "0.14"
# Compiles the `.proto` in-process. `prost-build` alone would shell out to
# `protoc`, which nothing else in this repository needs and which the Windows
# and Linux sides would have to install separately.
protox = "0.9"

[lints]
workspace = true
