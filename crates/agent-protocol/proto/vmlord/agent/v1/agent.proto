// The wire contract between VMLord on the host and vmlord-agent in a guest.
//
// Not a gRPC service: the transport is a single HvSocket stream the guest
// opens, and every message on it is an `Envelope` behind a 4-byte
// little-endian length prefix (see `vmlord_agent_protocol::frame`). A service
// definition would buy nothing here and would drag in an HTTP/2 stack on both
// sides of a socket that carries one connection per VM.
//
// Compatibility rules for anyone editing this file:
//
//   * never reuse or renumber a field -- both sides of this protocol are
//     upgraded separately, and a guest agent installed months ago is still
//     expected to talk to today's host;
//   * adding a message, a field, an enum value or a `oneof` arm is a minor
//     version bump; removing or repurposing one is a major bump;
//   * every enum keeps a zero `*_UNSPECIFIED` value, because proto3 cannot
//     tell "absent" from "first variant" without one.

syntax = "proto3";

package vmlord.agent.v1;

// One message on the wire, in either direction.
//
// The protocol is symmetric: the host sends requests to the guest (attach this
// GPU manifest, what is your GPU doing), and the guest sends requests to the
// host (here is my heartbeat). Both therefore use the same envelope rather
// than a client and a server envelope that would have to be kept in step.
message Envelope {
  // Correlates a response with the request that caused it.
  //
  // Unique per originator, not globally: each side numbers its own requests
  // from 1, and a response repeats the id of the request it answers. Zero is
  // reserved for messages that answer nothing.
  uint32 request_id = 1;

  oneof body {
    Request request = 2;
    Response response = 3;
  }
}

// Something a peer asks the other one to do.
message Request {
  oneof kind {
    HelloRequest hello = 1;
    HeartbeatRequest heartbeat = 2;
    AuthenticateRequest authenticate = 3;
    AttachGpuSharesRequest attach_gpu_shares = 4;
    ApplyGpuRecipeRequest apply_gpu_recipe = 5;
    ProbeGpuRequest probe_gpu = 6;
    AttachDisplayPayloadRequest attach_display_payload = 7;
    ApplyDisplayRecipeRequest apply_display_recipe = 8;
    UpdateDisplayPayloadRequest update_display_payload = 9;
  }
}

// The answer to exactly one `Request`, carrying its `request_id`.
message Response {
  oneof kind {
    // Answers any request that could not be carried out, including one whose
    // `kind` this peer does not know. It is arm 1 because every request can
    // fail, and a peer that cannot parse the request it was sent still has to
    // be able to say so.
    Error error = 1;
    HelloResponse hello = 2;
    HeartbeatResponse heartbeat = 3;
    AuthenticateResponse authenticate = 4;
    AttachGpuSharesResponse attach_gpu_shares = 5;
    ApplyGpuRecipeResponse apply_gpu_recipe = 6;
    ProbeGpuResponse probe_gpu = 7;
    AttachDisplayPayloadResponse attach_display_payload = 8;
    ApplyDisplayRecipeResponse apply_display_recipe = 9;
    UpdateDisplayPayloadResponse update_display_payload = 10;
  }
}

// The protocol revision a peer speaks.
//
// Two numbers rather than one: `major` is a compatibility barrier and `minor`
// is a feature level, so that a host one release ahead of an agent can decide
// to speak down to it instead of dropping the connection.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// An optional part of the protocol a peer implements.
//
// Separate from the version because capabilities are not ordered: an agent
// running on a VM with no GPU is not an older agent, it is one that has
// nothing to say about GPUs.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;

  // The peer can report on GPU-PV and act on a GPU share manifest.
  CAPABILITY_GPU = 1;

  // The peer can mount a display payload, apply the display recipe and update
  // what it has installed. Separate from the GPU capability because the two
  // stacks are installed, applied and reported on separately: an agent that
  // speaks one and not the other is an ordinary agent.
  CAPABILITY_DISPLAY = 2;
}

// Opens a session: the first message the guest sends after connecting.
message HelloRequest {
  // The highest revision the sender speaks.
  ProtocolVersion version = 1;

  // What the sender implements beyond the base protocol.
  //
  // Values this build does not know are kept as their numbers rather than
  // rejected: a newer agent announcing a capability an older host has never
  // heard of is a session that still works, minus that capability.
  repeated Capability capabilities = 2;

  // The agent build that is speaking, for logs and diagnostics only. Never
  // parsed to decide behaviour -- that is what `version` and `capabilities`
  // are for.
  string agent_version = 3;
}

// Accepts a session and states what the responder settled on.
message HelloResponse {
  // The revision both peers will use: the same `major` as the request, and
  // the lower of the two `minor`s.
  ProtocolVersion version = 1;

  // The capabilities both peers have, which is the only set either may use.
  repeated Capability capabilities = 2;
}

// Challenges the guest to prove it holds the VM's secret.
//
// Sent by the host once per session, after the hello exchange and before it
// will act on anything else the guest sends. The secret itself never appears
// in this protocol: it is minted when the VM is created and delivered through
// the same provisioning medium as the guest's password hash and authorized
// key, so what travels here is only a challenge over it.
message AuthenticateRequest {
  // 32 random bytes, drawn again for every session. Freshness is what makes a
  // recorded answer worthless: a tag proves the secret was held when this
  // nonce was sent, and says nothing about any other session.
  bytes nonce = 1;
}

// Answers the challenge with a tag only a holder of the secret can produce.
message AuthenticateResponse {
  // HMAC-SHA-256 over a fixed domain string and the nonce, keyed by the VM's
  // secret. 32 bytes; see `vmlord_agent_protocol::auth`, which both peers
  // compute this with so that they cannot disagree about what is signed.
  bytes tag = 1;
}

// Proves the session is alive and that the peer is still answering.
//
// Empty on purpose: whatever state the host wants from a guest belongs in a
// message named after that state, so that a heartbeat cannot quietly become
// the place where everything is polled from.
message HeartbeatRequest {}

message HeartbeatResponse {}

// Hands the guest the Plan9 shares its VM was given, for it to mount.
//
// Sent once per session, after the challenge, on a session that agreed
// `CAPABILITY_GPU`. A reconnecting agent is sent the manifest again: the host
// cannot tell a guest that lost its socket from one that rebooted, and the
// guest reconciles rather than mounts, so re-sending costs a message and
// saves the host from having to know which happened.
message AttachGpuSharesRequest {
  // Every share the VM has, not the ones that changed. The guest unmounts
  // what this list no longer names, which a delta could not express without
  // both ends agreeing on what was sent last.
  repeated GpuShare shares = 1;
}

// One Plan9 share, as the guest is told about it.
//
// A role and never a host path: where a share is mounted is the guest's
// decision, taken from its own allowlist, so a host cannot dictate a path
// into a guest filesystem and its topology stays on the host.
message GpuShare {
  // What the share is called on the host, which is also `aname=` when the
  // guest mounts it. Restricted to `[A-Za-z0-9._-]` by whatever named it,
  // because it travels in a comma-separated mount option string.
  string name = 1;

  GpuShareRole role = 2;

  // The DriverStore folder the package came from, for
  // `GPU_SHARE_ROLE_DRIVER_PACKAGE` and empty for every other role. It is
  // what distinguishes one package share from the next, and the guest
  // validates it before it becomes part of a path.
  string package = 3;
}

// What the guest is meant to make of a share.
//
// An enum rather than a convention about the name, so that an agent installed
// months ago is never asked to derive meaning from a string a newer host
// invented.
enum GpuShareRole {
  GPU_SHARE_ROLE_UNSPECIFIED = 0;

  // The host's WSL Linux userspace.
  GPU_SHARE_ROLE_WSL_LIB = 1;

  // One driver package, named by `GpuShare.package`.
  GPU_SHARE_ROLE_DRIVER_PACKAGE = 2;

  // The VM's own prepared GPU payload generation.
  GPU_SHARE_ROLE_GPU_PAYLOAD = 3;

  // The Microsoft D3D12 userspace, which the WSL package installs beside
  // itself rather than into System32. On hosts old enough to have kept
  // everything in one place there is no such share and no such directory.
  GPU_SHARE_ROLE_WSL_D3D12 = 4;
}

// What the guest made of the manifest, share by share.
message AttachGpuSharesResponse {
  // One entry per share of the request, in the order they arrived.
  repeated GpuMount mounts = 1;

  // Whether the dynamic linker was told about the mounted directories that
  // hold shared objects. Separate from the mounts because a set of mounts
  // that all succeeded is still unusable if `ldconfig` did not run.
  bool libraries_refreshed = 2;
}

// What became of one share in the guest.
message GpuMount {
  // The share's name, repeated from the request so the host does not have to
  // match this list against that one by position.
  string share = 1;

  GpuMountState state = 2;

  // Where the share is mounted, and empty when it is not.
  string path = 3;

  // Free text for the host's log. `state` is what a peer branches on.
  string message = 4;
}

enum GpuMountState {
  GPU_MOUNT_STATE_UNSPECIFIED = 0;

  // The share is mounted at `path` and reads back.
  GPU_MOUNT_STATE_MOUNTED = 1;

  // The guest has no target for this share: a role this build does not know,
  // a package name it will not put in a path, or a target another share of
  // the same manifest already claimed.
  GPU_MOUNT_STATE_REFUSED = 2;

  // The guest has a target for it and could not mount it, or mounted it and
  // could not read it back.
  GPU_MOUNT_STATE_FAILED = 3;
}

// Asks the guest to apply its distribution's GPU recipe.
//
// Sent once per session, after the manifest the guest mounted, on a session
// that agreed `CAPABILITY_GPU`. Empty on purpose: everything the guest needs
// to decide is either in the guest -- `/etc/os-release`, `uname` -- or in the
// payload it was told to mount one message earlier, and a field here would be
// the host dictating something it cannot know better than the guest does.
message ApplyGpuRecipeRequest {}

// What the guest's recipe did, stage by stage.
//
// A list of stages and never a verdict: "the module built and /dev/dxg never
// appeared" and "the headers would not install" are one word apart in a
// summary and are different problems. Deriving a state from these facts
// belongs to the host's application layer.
message ApplyGpuRecipeResponse {
  // Every step of the recipe, in the order it is attempted, including the
  // ones that never ran. A report that stopped at the failure would leave the
  // host guessing whether the rest was skipped or the agent hung up.
  repeated GpuRecipeStage stages = 1;
}

message GpuRecipeStage {
  GpuRecipeStep step = 1;

  GpuRecipeStageState state = 2;

  // Free text for the host's log: the reason a stage was skipped, or the tail
  // of what the program that failed had to say. `state` is what a peer
  // branches on.
  string message = 3;
}

// One step of a guest's GPU recipe.
//
// The kernel steps arrive with the recipe that has them; a distribution that
// needs a different sequence gets its own values rather than a
// reinterpretation of these.
enum GpuRecipeStep {
  GPU_RECIPE_STEP_UNSPECIFIED = 0;

  // Whether this guest is one the agent has a recipe for at all.
  GPU_RECIPE_STEP_DISTRIBUTION = 1;

  // The mounted payload: its provenance, its target and its module sources.
  GPU_RECIPE_STEP_PAYLOAD = 2;

  // The compiler, DKMS and the running kernel's headers.
  GPU_RECIPE_STEP_BUILD_DEPENDENCIES = 3;

  // The module sources, staged where the build framework expects them.
  GPU_RECIPE_STEP_MODULE_SOURCE = 4;

  // Building and installing the module for the running kernel.
  GPU_RECIPE_STEP_MODULE_BUILD = 5;

  // Loading the module now and on every boot after this one.
  GPU_RECIPE_STEP_MODULE_LOAD = 6;

  // The device node the module is there to create.
  GPU_RECIPE_STEP_DEVICE = 7;

  // The Mesa userspace the payload's policy calls for: the distribution's
  // own, or the tree the payload carries.
  GPU_RECIPE_STEP_USERSPACE = 8;

  // The Vulkan driver a payload may carry, registered where the loader
  // looks for it.
  GPU_RECIPE_STEP_VULKAN_ICD = 9;

  // What makes a process in this guest pick that userspace.
  GPU_RECIPE_STEP_ENVIRONMENT = 10;
}

enum GpuRecipeStageState {
  GPU_RECIPE_STAGE_STATE_UNSPECIFIED = 0;

  // The stage did what it is for.
  GPU_RECIPE_STAGE_STATE_OK = 1;

  // The stage did not have to run: the guest already satisfies it, or the
  // recipe stopped before reaching it.
  GPU_RECIPE_STAGE_STATE_SKIPPED = 2;

  // The stage ran and did not succeed.
  GPU_RECIPE_STAGE_STATE_FAILED = 3;
}

// Asks the guest whether anything renders on the GPU it was given.
//
// Sent once per session, after the recipe report of the same session, on a
// session that agreed `CAPABILITY_GPU`. Empty for the reason
// `ApplyGpuRecipeRequest` is: what there is to look at is in the guest, and a
// field here would be the host dictating something it cannot know better.
message ProbeGpuRequest {}

// What the guest found when it looked.
message ProbeGpuResponse {
  // What the guest makes of what it saw. The guest decides it, because the
  // guest is the only side that saw the output of the programs it ran; a host
  // that re-derived a verdict from the checks could disagree with the peer
  // that produced them.
  GpuProbeVerdict verdict = 1;

  // Every check, in the order it is attempted, including the ones that never
  // ran. A report that stopped at the failure would leave the host guessing
  // whether the rest was skipped or the agent hung up.
  repeated GpuProbeCheck checks = 2;

  // What the hardware renderer calls itself, when one answered, and empty
  // when none did.
  string renderer = 3;

  // What the guest kernel driver calls itself, when it says.
  string driver = 4;

  // The DRM render node the guest has, such as `/dev/dri/renderD128`, and
  // empty when it has none. The d3d12 path needs no render node, so this is a
  // fact for diagnostics and never a requirement.
  string render_node = 5;
}

message GpuProbeCheck {
  GpuProbeStep step = 1;

  GpuProbeCheckState state = 2;

  // Free text for the host's log: what was found, or what the program that
  // failed had to say. `state` is what a peer branches on.
  string message = 3;
}

// One thing the probe looks at.
enum GpuProbeStep {
  GPU_PROBE_STEP_UNSPECIFIED = 0;

  // The device node, opened rather than merely found.
  GPU_PROBE_STEP_DEVICE = 1;

  // The kernel module behind that device.
  GPU_PROBE_STEP_KERNEL_MODULE = 2;

  // The libraries a renderer has to be able to open.
  GPU_PROBE_STEP_LIBRARIES = 3;

  // The programs the two renderer checks run.
  GPU_PROBE_STEP_TOOLS = 4;

  // A bounded OpenGL operation on the device.
  GPU_PROBE_STEP_OPENGL = 5;

  // A bounded Vulkan operation on the device.
  GPU_PROBE_STEP_VULKAN = 6;

  // Whatever the vendor's own tool has to say. Diagnostics only: it never
  // decides the verdict.
  GPU_PROBE_STEP_VENDOR = 7;
}

// The three values of a check.
//
// The same three a recipe stage has and deliberately not the same enum: a
// recipe stage is work that was done and a check is a fact that was looked
// at, and a value added to one must not appear in the other.
enum GpuProbeCheckState {
  GPU_PROBE_CHECK_STATE_UNSPECIFIED = 0;

  // What the check looked for is there.
  GPU_PROBE_CHECK_STATE_OK = 1;

  // The check did not run, and the message says why.
  GPU_PROBE_CHECK_STATE_SKIPPED = 2;

  // The check ran and what it looked for is not there.
  GPU_PROBE_CHECK_STATE_FAILED = 3;
}

// What the guest makes of its GPU.
enum GpuProbeVerdict {
  GPU_PROBE_VERDICT_UNSPECIFIED = 0;

  // The device node is not there, or will not open.
  GPU_PROBE_VERDICT_NO_DEVICE = 1;

  // The device opened and no hardware renderer answered.
  GPU_PROBE_VERDICT_DEVICE_ONLY = 2;

  // At least one hardware renderer answered, which is what makes a GPU a GPU.
  GPU_PROBE_VERDICT_RENDERS = 3;
}

// A request that failed, described so the other side can act on it.
// ---------------------------------------------------------------- display

// What the guest is told about the one display share it is offered.
//
// Its own request and not a role inside AttachGpuShares: a GPU attach that
// fails must not be able to take the display down with it, and the two are
// mounted, applied and reported on separately from the host to the guest.
message AttachDisplayPayloadRequest {
  DisplayShare share = 1;
}

message DisplayShare {
  // The share's name, which is also `aname=` when the guest mounts it. The
  // guest refuses any name but the one it knows: mounting whatever it is
  // handed would be a guest with no boundary at all.
  string name = 1;
}

message AttachDisplayPayloadResponse {
  DisplayMount mount = 1;
}

message DisplayMount {
  string name = 1;
  // Where the guest put it. The host names the share; where it lands is the
  // guest's business, and this is how the host learns which it was.
  string mount_point = 2;
  DisplayMountState state = 3;
  string message = 4;
}

enum DisplayMountState {
  DISPLAY_MOUNT_STATE_UNSPECIFIED = 0;
  DISPLAY_MOUNT_STATE_MOUNTED = 1;
  DISPLAY_MOUNT_STATE_ALREADY_MOUNTED = 2;
  DISPLAY_MOUNT_STATE_FAILED = 3;
  DISPLAY_MOUNT_STATE_REFUSED = 4;
}

// Everything else the guest needs in order to decide is in the guest or in the
// payload it mounted one message earlier.
message ApplyDisplayRecipeRequest {
  // The mode this VM's output is to come up at, as the host has it stored.
  //
  // Absent is a VM nothing has been saved for, which is every VM until task
  // #120 saves one, and the guest answers absence with its own fallback. A
  // message rather than two uint32s precisely so that absence and a width of
  // zero are different things: proto3 scalars have no absence, and a zero
  // width read as a mode is an output nobody can see.
  DisplayMode initial_mode = 1;
}

// One output mode, in pixels.
message DisplayMode {
  uint32 width = 1;
  uint32 height = 2;
}

message ApplyDisplayRecipeResponse {
  repeated DisplayRecipeStage stages = 1;
  DisplayPayloadVersions versions = 2;
}

// Moves the guest to the version the mounted payload carries.
//
// Never sent as part of a start: installation reconciles by itself and a
// version change is something a person asks for.
message UpdateDisplayPayloadRequest {
  // The version the mounted payload is expected to carry. The guest refuses
  // rather than installs when the mount says something else: an update to a
  // version nobody asked for is worse than an update that did not happen.
  string target_version = 1;
}

message UpdateDisplayPayloadResponse {
  repeated DisplayRecipeStage stages = 1;
  DisplayPayloadVersions versions = 2;
  DisplayUpdateOutcome outcome = 3;
}

enum DisplayUpdateOutcome {
  DISPLAY_UPDATE_OUTCOME_UNSPECIFIED = 0;
  // The target version is installed, loaded and verified.
  DISPLAY_UPDATE_OUTCOME_UPDATED = 1;
  // The target version did not verify and the previous one is running again.
  // A working display, and not a degradation.
  DISPLAY_UPDATE_OUTCOME_ROLLED_BACK = 2;
  // Neither version is running.
  DISPLAY_UPDATE_OUTCOME_FAILED = 3;
  // The target version is installed and will be loaded after the guest reboots.
  // The currently loaded module could not be unloaded safely.
  DISPLAY_UPDATE_OUTCOME_REBOOT_REQUIRED = 4;
}

// Which versions of the display payload are in play inside the guest.
//
// An empty string is "not present": proto3 scalars have no absence, and a
// sentinel that looks like a version would be read as one.
message DisplayPayloadVersions {
  string installed = 1;
  string previous = 2;
  string loaded = 3;
}

// One step of the display recipe, and what became of it.
message DisplayRecipeStage {
  DisplayRecipeStep step = 1;
  DisplayRecipeStageState state = 2;
  string message = 3;
}

enum DisplayRecipeStep {
  DISPLAY_RECIPE_STEP_UNSPECIFIED = 0;
  DISPLAY_RECIPE_STEP_DISTRIBUTION = 1;
  DISPLAY_RECIPE_STEP_PAYLOAD = 2;
  DISPLAY_RECIPE_STEP_BUILD_DEPENDENCIES = 3;
  DISPLAY_RECIPE_STEP_MODULE_SOURCE = 4;
  DISPLAY_RECIPE_STEP_MODULE_BUILD = 5;
  DISPLAY_RECIPE_STEP_MODULE_LOAD = 6;
  DISPLAY_RECIPE_STEP_DEVICE = 7;
  DISPLAY_RECIPE_STEP_SERVICES = 8;
  DISPLAY_RECIPE_STEP_SERVICES_START = 9;
  DISPLAY_RECIPE_STEP_INITRAMFS = 10;
}

enum DisplayRecipeStageState {
  DISPLAY_RECIPE_STAGE_STATE_UNSPECIFIED = 0;
  DISPLAY_RECIPE_STAGE_STATE_OK = 1;
  DISPLAY_RECIPE_STAGE_STATE_SKIPPED = 2;
  DISPLAY_RECIPE_STAGE_STATE_FAILED = 3;
}

// ---------------------------------------------------------------- errors

message Error {
  ErrorCode code = 1;

  // Free text for logs. Not shown to users as-is and never parsed: `code` is
  // what a peer branches on.
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // The peer's `major` differs, so there is nothing to negotiate down to.
  ERROR_CODE_UNSUPPORTED_VERSION = 1;

  // A request arrived before the session was authenticated.
  ERROR_CODE_UNAUTHENTICATED = 2;

  // The request is well-formed but this build has no arm for it, or it needs
  // a capability the session did not agree on.
  ERROR_CODE_UNSUPPORTED_REQUEST = 3;

  // The request is understood and its contents are not usable.
  ERROR_CODE_INVALID_ARGUMENT = 4;

  // The request is fine and the peer cannot serve it right now; retrying may
  // work.
  ERROR_CODE_UNAVAILABLE = 5;

  // The peer failed at something that is its own fault.
  ERROR_CODE_INTERNAL = 6;
}
