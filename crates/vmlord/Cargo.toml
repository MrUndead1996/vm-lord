[package]
name = "vmlord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "vmlord"
test = false
bench = false

# The COM1 diagnostic reader, hosted by a terminal window rather than by the
# GUI. It ships beside `vmlord.exe` because that is where the launcher looks
# for it.
[[bin]]
name = "vmlord-com1"
path = "src/bin/vmlord-com1.rs"
test = false
bench = false

# The host of an interactive SSH session, for the same reason and in the same
# place: a terminal window needs a program to host, and this one waits for
# ssh.exe so that VMLord can say how the session ended.
[[bin]]
name = "vmlord-ssh"
path = "src/bin/vmlord-ssh.rs"
test = false
bench = false

[dependencies]
tracing.workspace = true
# The Windows common file dialogs, behind the application layer's picker
# traits. Wired here because those traits belong to `app`, which `platform`
# does not depend on.
rfd = "0.17"
semver.workspace = true
vmlord-app = { path = "../app" }
vmlord-core = { path = "../core" }
vmlord-image = { path = "../image" }
vmlord-platform = { path = "../platform" }
vmlord-ui = { path = "../ui" }

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
