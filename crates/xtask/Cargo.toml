[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Build automation, not part of the product. It is invoked through the Cargo
# aliases in `.cargo/config.toml`, so it stays out of `default-members`.
[[bin]]
name = "xtask"
bench = false

[lints]
workspace = true

[dependencies]
# The offline AppSandbox conversion, which this crate only gives a command
# line to. Linux-only, like the conversion itself.
vmlord-appsandbox-convert = { path = "../appsandbox-convert" }
vmlord-display-codec = { path = "../display-codec" }
vmlord-display-payload = { path = "../display-payload", features = ["builder"] }
# For the one version this build actually speaks, so a recipe cannot claim a
# range the services in it do not cover.
vmlord-display-protocol = { path = "../display-protocol" }
vmlord-gpu-payload = { path = "../gpu-payload", features = ["builder"] }
vmlord-payload = { path = "../payload" }

# For the recipe's declared protocol range, which `pack` checks before it
# builds anything, and for reading back the catalog entry it wrote.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The release manifest is built from `vmlord-core`'s own types and put through
# its own validation, so what a release publishes and what an installation
# accepts cannot drift apart.
vmlord-core = { path = "../core" }
# The workflow validator reads `.github/workflows/*.yml` as data rather than as
# text, so a check cannot be fooled by a comment or by reordered keys.
serde_yaml_ng = "0.10"
semver.workspace = true
sha2 = "0.11"
