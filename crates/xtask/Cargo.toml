[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Build automation, not part of the product. It is invoked through the Cargo
# aliases in `.cargo/config.toml`, so it stays out of `default-members`.
[[bin]]
name = "xtask"
bench = false

[lints]
workspace = true

[dependencies]
vmlord-display-codec = { path = "../display-codec" }
vmlord-display-payload = { path = "../display-payload", features = ["builder"] }
vmlord-gpu-payload = { path = "../gpu-payload", features = ["builder"] }
vmlord-payload = { path = "../payload" }

# Tests only: reading back the catalog entry `pack` wrote. The build tool
# itself reads it through `PayloadCatalog::from_entry_json`.
[dev-dependencies]
serde_json = "1.0"
