[package]
name = "vmlord-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
qcow = "1"
sha2 = "0.11"
# `gzip`, part of the default feature set, is deliberately off: with it `ureq`
# sends `accept-encoding: gzip` and transparently decompresses the body, after
# which the number of bytes read no longer matches the number of bytes in the
# file and the resume offset drifts.
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "win-system-proxy",
] }
vmlord-core = { path = "../core" }

[dev-dependencies]
sha2 = "0.11"
vmlord-core = { path = "../core", features = ["test-profile"] }

[lints]
workspace = true
