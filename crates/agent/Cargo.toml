[package]
name = "vmlord-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

# The agent is a guest program, so it is not part of the workspace's default
# build -- see `default-members` in the root manifest. Build it with:
#
#     cargo build -p vmlord-agent --target x86_64-unknown-linux-gnu
[[bin]]
name = "vmlord-agent"
test = false
bench = false

[dependencies]
vmlord-agent-protocol = { path = "../agent-protocol" }

[lints]
workspace = true
