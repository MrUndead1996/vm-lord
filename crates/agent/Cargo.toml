[package]
name = "vmlord-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The agent is a guest program, so it is not part of the workspace's default
# build -- see `default-members` in the root manifest. Build it with:
#
#     cargo agent
[[bin]]
name = "vmlord-agent"
bench = false

[dependencies]
libc = { version = "0.2", default-features = false }
# The payload states what it was built for in its own `sources.json`, and the
# guest is what compares that with itself. Pure Rust with no C library behind
# it, so `cargo agent` still cross-compiles to musl with no toolchain.
serde_json = "1.0"
# The guest verifies the payload it mounted before it copies anything out of
# it: the host's check is on the other side of a filesystem the host can write.
sha2 = "0.11"
vmlord-agent-protocol = { path = "../agent-protocol" }

[lints]
# This guest crate owns its Linux socket descriptor directly. `vsock.rs` is
# the sole module that needs unsafe calls into the kernel ABI.

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
